<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:20px;font-family:system-ui,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#182537)}
.header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{background:var(--tg-theme-button-color,#3279eb);color:var(--tg-theme-button-text-color,#fff);border-radius:12px;padding:9px;font-weight:800}
.brand{font-size:17px;font-weight:750}.sub{font-size:12px;color:var(--tg-theme-hint-color,#7a8696)}
h1{font-size:18px;line-height:1.3;margin:0 0 14px;white-space:pre-wrap;max-height:115px;overflow:hidden}
#actions{display:flex;flex-direction:column;gap:7px}
button{display:block;box-sizing:border-box;width:100%;height:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;border:0;border-radius:11px;padding:10px 13px;background:var(--tg-theme-secondary-bg-color,#edf2f8);color:var(--tg-theme-text-color,#182537);font-size:14px;font-weight:600;touch-action:none}
button:active{opacity:.65}button:disabled{opacity:.5}
.nav{display:flex;gap:7px;margin-top:10px}.nav button{min-width:0;padding:10px 6px;text-align:center;font-size:12px}
#feedback{min-height:16px;margin-top:10px;font-size:12px;color:var(--tg-theme-hint-color,#7a8696)}
</style></head><body>
<div class="header"><div class="logo">hh</div><div><div class="brand">Resume Bot</div><div class="sub">Поиск работы под контролем</div></div></div>
<h1 id="title">Откройте /menu в личном чате с ботом</h1>
<div id="actions"></div><div id="nav" class="nav"></div>
<div id="feedback"></div>
<script>
(function(){
var widget=window.TelegramWidget;
if(!widget){return;}
var state=null,busy=false;
var title=document.getElementById('title'),actions=document.getElementById('actions'),nav=document.getElementById('nav'),feedback=document.getElementById('feedback');
function request(action){
 if(busy||!state){return;}busy=true;feedback.textContent='Обновляю…';
 widget.request('hb:'+state.n+':'+action).then(function(answer){
  busy=false;feedback.textContent=(answer&&answer.result)||'';
 },function(){busy=false;feedback.textContent='Не удалось выполнить. Откройте /menu и повторите.';});
}
function button(label,action,parent){
 var el=document.createElement('button');el.textContent=label;
 el.addEventListener('click',function(){request(action);});parent.appendChild(el);
}
function render(){
 try{state=JSON.parse(widget.chatData||'null');}catch(e){state=null;}
 actions.textContent='';nav.textContent='';feedback.textContent='';
 if(!state){title.textContent='Откройте /menu в личном чате с ботом';return;}
 title.textContent=state.t;
 for(var i=0;i<state.b.length;i++){button(state.b[i].t,'a'+state.b[i].i,actions);}
 if(state.p>0){button('←','p'+(state.p-1),nav);}
 if(state.p+1<state.c){button('Далее →','p'+(state.p+1),nav);}
 button('Обновить','r',nav);
}
widget.onEvent('chatDataChanged',render);
render();widget.ready();
})();
</script></body></html>
