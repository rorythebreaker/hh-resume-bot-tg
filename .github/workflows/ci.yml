name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/widget_client.test.cjs tests/mini_app_client.test.cjs
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: pytest -q
      - run: python verify_release.py
      - name: Shell syntax
        run: for f in *.sh; do bash -n "$f"; done
      - name: Validate production Compose
        env:
          HH_IMAGE: hh-resume-bot-tg:2.5.4
        run: docker compose -f compose.production.yml config --quiet
      - name: Build Docker image
        run: docker compose build
      - name: Start all three services with local Telegram substitute
        env:
          TG_BOT_TOKEN: ci-dummy
          TG_CHAT_ID: '1'
          TG_API_ROOT: http://hh-telegram-stub:8765
        run: |
          docker network create hh-ci
          docker run -d --name hh-telegram-stub --network hh-ci -v "$PWD:/src:ro" hh-resume-bot-tg:2.5.4 python /src/tests/telegram_stub.py
          printf 'networks:\n  default:\n    external: true\n    name: hh-ci\n' > compose.ci.yml
          docker compose -f docker-compose.yml -f compose.ci.yml up -d --wait --wait-timeout 90
          docker compose ps
          docker exec hh-telegram-stub python -c "import json,urllib.request; s=json.load(urllib.request.urlopen('http://localhost:8765/status')); assert all(s.get(m,0)>0 for m in ('sendWidget','editMessageWidgetData','answerWidgetQuery')),s; print('HTMLBubbles round trip passed')"
          docker compose stop -t 20
      - name: Mini App container API smoke
        env:
          TG_BOT_TOKEN: ci-dummy
          TG_CHAT_ID: '1'
          TG_API_ROOT: http://hh-telegram-stub:8765
          TG_MINI_APP_URL: https://hh-ci.example.com
        run: |
          docker compose -f docker-compose.yml -f compose.ci.yml up -d --wait --wait-timeout 90
          python - <<'PY'
          import hashlib,hmac,json,time,urllib.request,urllib.error
          from urllib.parse import urlencode
          base='http://127.0.0.1:8080'
          assert json.load(urllib.request.urlopen(base+'/health'))['ok']
          try:
              urllib.request.urlopen(base+'/api/state')
              raise AssertionError('Unauthenticated state was accepted')
          except urllib.error.HTTPError as exc:
              assert exc.code==401
          fields={'auth_date':str(int(time.time())),'user':json.dumps({'id':1},separators=(',',':'))}
          check=chr(10).join(k+'='+v for k,v in sorted(fields.items()))
          secret=hmac.new(b'WebAppData',b'ci-dummy',hashlib.sha256).digest()
          fields['hash']=hmac.new(secret,check.encode(),hashlib.sha256).hexdigest()
          req=urllib.request.Request(base+'/api/state',headers={'Authorization':'tma '+urlencode(fields)})
          state=json.load(urllib.request.urlopen(req))
          assert state['profile']['account']=='main' and state['menu']['rows']
          print('Mini App authenticated container API passed')
          PY
          docker compose stop -t 20
      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save hh-resume-bot-tg:2.5.4 | gzip > "$RUNNER_TEMP/hh-image.tar.gz"
      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hh-image
          path: ${{ runner.temp }}/hh-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --remove-orphans; docker rm -f hh-telegram-stub || true

  publish:
    name: Publish image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: hh-image
          path: ${{ runner.temp }}/hh-image

      - name: Load image
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/hh-image/hh-image.tar.gz" | docker load

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GH_USER" --password-stdin

      - name: Publish commit image
        env:
          GH_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GH_REPOSITORY,,}"
          docker tag hh-resume-bot-tg:2.5.4 "$IMAGE:$COMMIT_SHA"
          docker push "$IMAGE:$COMMIT_SHA"
          printf 'Published `%s:%s`\n' "$IMAGE" "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: hh-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy published image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          CURRENT_HEAD="$(gh api "repos/$GH_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$CURRENT_HEAD" != "$COMMIT_SHA" ]]; then
            echo "Skipped: main already contains a newer commit."
            exit 0
          fi

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]

          trap 'rm -f "$RUNNER_TEMP/hh_key" "$RUNNER_TEMP/hh_hosts"' EXIT

          printf '%s\n' "$DEPLOY_SSH_KEY" |
            tr -d '\r' > "$RUNNER_TEMP/hh_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" |
            tr -d '\r' > "$RUNNER_TEMP/hh_hosts"

          ssh -F /dev/null -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$RUNNER_TEMP/hh_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=40 \
            -i "$RUNNER_TEMP/hh_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $COMMIT_SHA"

          printf 'Deployed commit `%s`\n' "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
