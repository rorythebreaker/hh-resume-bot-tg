name: SSH check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check VPS connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"

          trap 'rm -f "$RUNNER_TEMP/hh_key" "$RUNNER_TEMP/hh_hosts"' EXIT

          printf '%s\n' "$DEPLOY_SSH_KEY" |
            tr -d '\r' > "$RUNNER_TEMP/hh_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" |
            tr -d '\r' > "$RUNNER_TEMP/hh_hosts"

          ssh -F /dev/null -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$RUNNER_TEMP/hh_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -i "$RUNNER_TEMP/hh_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" check
